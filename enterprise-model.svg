<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">Pełniejszy model Product Buildera w enterprise SaaS</title><desc id="desc">Mapa obszarów od discovery przez MVP i wdrożenie do adopcji, retencji, monetyzacji i decyzji portfolio.</desc>
<rect width="1600" height="980" fill="#f7f8fc"/>
<style>.h{font:700 42px Inter,Arial,sans-serif;fill:#17203a}.sub{font:400 20px Inter,Arial,sans-serif;fill:#65708a}.k{font:800 14px Inter,Arial,sans-serif;fill:#5066b5;letter-spacing:1.6px}.t{font:700 24px Inter,Arial,sans-serif;fill:#17203a}.b{font:400 17px Inter,Arial,sans-serif;fill:#59647d}.s{font:700 16px Inter,Arial,sans-serif;fill:#26304a}.arrow{stroke:#8797cf;stroke-width:3;fill:none;marker-end:url(#m)}.box{fill:#fff;stroke:#dfe4ee;stroke-width:2}.soft{fill:#eef3ff;stroke:#cfd8f7;stroke-width:2}.green{fill:#e8f6eb;stroke:#b9dfc2;stroke-width:2}.yellow{fill:#fff8d5;stroke:#ead68a;stroke-width:2}</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8797cf"/></marker></defs>
<text x="70" y="76" class="k">ZAŁĄCZNIK / MODEL ENTERPRISE</text><text x="70" y="130" class="h">Co mierzę poza uproszczonym case'em</text><text x="70" y="170" class="sub">Nie wszystko naraz. Zakres pomiaru rośnie wraz z dojrzałością produktu i poziomem inwestycji.</text>

<rect x="70" y="230" rx="18" ry="18" width="270" height="190" class="box"/><text x="95" y="270" class="k">1 / DISCOVERY</text><text x="95" y="310" class="t">Problem i segment</text><text x="95" y="345" class="b">• rozmowy z userami / CFO</text><text x="95" y="375" class="b">• obecny workflow i workaround</text><text x="95" y="405" class="b">• częstotliwość / koszt problemu</text>
<rect x="390" y="230" rx="18" ry="18" width="270" height="190" class="soft"/><text x="415" y="270" class="k">2 / MVP</text><text x="415" y="310" class="t">Pierwsza wartość</text><text x="415" y="345" class="b">• activation</text><text x="415" y="375" class="b">• time-to-first-value</text><text x="415" y="405" class="b">• completion core workflow</text>
<rect x="710" y="230" rx="18" ry="18" width="270" height="190" class="box"/><text x="735" y="270" class="k">3 / PILOT</text><text x="735" y="310" class="t">Użycie i wartość</text><text x="735" y="345" class="b">• adopcja kont i ról</text><text x="735" y="375" class="b">• repeat usage</text><text x="735" y="405" class="b">• jakościowy feedback</text>
<rect x="1030" y="230" rx="18" ry="18" width="270" height="190" class="green"/><text x="1055" y="270" class="k">4 / COMMERCIAL</text><text x="1055" y="310" class="t">Monetyzacja</text><text x="1055" y="345" class="b">• pilot → paid</text><text x="1055" y="375" class="b">• ACV / pricing / packaging</text><text x="1055" y="405" class="b">• pipeline / win-loss</text>
<path d="M340 325 H385" class="arrow"/><path d="M660 325 H705" class="arrow"/><path d="M980 325 H1025" class="arrow"/>

<rect x="70" y="490" rx="18" ry="18" width="370" height="205" class="box"/><text x="95" y="530" class="k">ADOPCJA I RETENCJA</text><text x="95" y="570" class="t">Czy wartość się utrzymuje?</text><text x="95" y="607" class="b">• active accounts / role penetration</text><text x="95" y="637" class="b">• cohort retention W4 / W8 / W12</text><text x="95" y="667" class="b">• breadth / depth kluczowego workflow</text>
<rect x="485" y="490" rx="18" ry="18" width="370" height="205" class="yellow"/><text x="510" y="530" class="k">ENTERPRISE READINESS</text><text x="510" y="570" class="t">Czy economics nie zabija wdrożenie?</text><text x="510" y="607" class="b">• time-to-implement / integrations</text><text x="510" y="637" class="b">• security / permissions / audit</text><text x="510" y="667" class="b">• support load / SLA / reliability</text>
<rect x="900" y="490" rx="18" ry="18" width="370" height="205" class="soft"/><text x="925" y="530" class="k">PORTFOLIO I BIZNES</text><text x="925" y="570" class="t">Czy produkt wzmacnia platformę?</text><text x="925" y="607" class="b">• ARR / expansion / NRR impact</text><text x="925" y="637" class="b">• attach rate / cross-sell</text><text x="925" y="667" class="b">• opportunity cost / shared capabilities</text>

<rect x="70" y="755" rx="22" ry="22" width="1230" height="145" fill="#172554"/><text x="105" y="800" style="font:800 15px Inter,Arial,sans-serif;fill:#aebdff;letter-spacing:1.4px">BRAMKA DECYZYJNA</text><text x="105" y="842" style="font:700 27px Inter,Arial,sans-serif;fill:white">Rozwijamy / zmieniamy kierunek / zatrzymujemy</text><text x="105" y="875" style="font:400 17px Inter,Arial,sans-serif;fill:#d5dcf4">Decyzja łączy problem, adopcję, retencję, wartość, monetyzację, ryzyko enterprise i wpływ na portfolio.</text>
<path d="M255 695 V748" class="arrow"/><path d="M670 695 V748" class="arrow"/><path d="M1085 695 V748" class="arrow"/>

<rect x="1345" y="230" rx="18" ry="18" width="190" height="470" fill="#fff" stroke="#dfe4ee" stroke-width="2"/><text x="1370" y="270" class="k">STAŁY LOOP</text><text x="1370" y="312" class="s">Customer calls</text><text x="1370" y="344" class="b">CRM / CSM / Support</text><text x="1370" y="390" class="s">Product analytics</text><text x="1370" y="422" class="b">cohorts / funnels</text><text x="1370" y="468" class="s">Feedback repo</text><text x="1370" y="500" class="b">Productboard / docs</text><text x="1370" y="546" class="s">GTM learning</text><text x="1370" y="578" class="b">win/loss / objections</text><text x="1370" y="624" class="s">Build / don't build</text><text x="1370" y="656" class="b">ciągłe decyzje</text>
<text x="70" y="944" class="sub">Uproszczony case pokazuje tylko najważniejsze sygnały. Ten model pokazuje pełniejszy warsztat Product Buildera po wejściu produktu w realne enterprise delivery.</text>
</svg>